[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeks-evals"
version = "0.0.1"
description = "A small eval harness: JSONL eval sets, exact-match / schema / LLM-judge scoring, and a CI gate that fails when the pass rate drops."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Fortan Pireva" }]
keywords = ["llm", "evals", "evaluation", "ci"]
dependencies = []

[project.optional-dependencies]
judge = ["anthropic>=0.40"]
supabase = ["supabase>=2"]
langfuse = ["langfuse>=3"]
all = ["codeks-evals[judge,supabase,langfuse]"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
codeks-evals = "codeks_evals.cli:main"

[project.urls]
Homepage = "https://labs.codeks.net"
Repository = "https://github.com/codeksnet/evals"

[tool.hatch.build.targets.wheel]
packages = ["src/codeks_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
